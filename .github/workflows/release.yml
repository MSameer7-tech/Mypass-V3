name: MyPass Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override for manual build (e.g. 3.1.0-dev)'
        required: false
        default: '3.1.0-dev'

permissions:
  contents: write

jobs:
  validate:
    name: Quality Gate & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Backend Tests
        run: |
          PYTHONPATH=backend pytest backend/tests -q

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend Quality Gates
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  build-macos-arm64:
    name: Build macOS (ARM64)
    needs: validate
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version Variable
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version_override || '3.1.0-dev' }}"
          fi
          echo "RELEASE_VERSION=$VER" >> $GITHUB_ENV
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build macOS Python Sidecar
        run: |
          python3 -m venv backend/venv
          ./backend/venv/bin/pip install --upgrade pip
          ./backend/venv/bin/pip install -r backend/requirements.txt
          python3 backend/build_sidecar.py

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        run: |
          rustup target add aarch64-apple-darwin

      - name: Build Tauri macOS DMG
        run: |
          echo "{\"version\":\"${{ env.RELEASE_VERSION }}\"}" > frontend/src-tauri/tauri.release.json
          cd frontend
          pnpm install --frozen-lockfile
          pnpm tauri build --target aarch64-apple-darwin --config src-tauri/tauri.release.json

      - name: Verify Binary Architecture
        run: |
          echo "Verifying Mach-O ARM64 architecture..."
          APP_BIN=$(find frontend/src-tauri/target -path "*/Contents/MacOS/MyPass" | head -n 1)
          if [ -z "$APP_BIN" ]; then
            echo "Binary MyPass not found!"
            exit 1
          fi
          file "$APP_BIN" | grep "arm64"

      - name: Stage macOS Release Artifact
        run: |
          mkdir -p dist-artifacts
          DMG_FILE=$(find frontend/src-tauri/target -name "*.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "DMG file not found!"
            exit 1
          fi
          cp "$DMG_FILE" "dist-artifacts/MyPass_${{ env.RELEASE_VERSION }}_aarch64.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist-artifacts/MyPass_${{ env.RELEASE_VERSION }}_aarch64.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version Variable
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like "v*") {
            $ver = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $ver = "${{ inputs.version_override }}"
            if (-not $ver) { $ver = "3.1.0-dev" }
          }
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows x64 Python Sidecar
        shell: pwsh
        run: |
          python -m venv backend/venv
          .\backend\venv\Scripts\python.exe -m pip install --upgrade pip
          .\backend\venv\Scripts\pip.exe install -r backend/requirements.txt
          python backend/build_sidecar.py

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc

      - name: Build Tauri Windows x64 NSIS Installer
        shell: pwsh
        run: |
          Set-Content -Path frontend/src-tauri/tauri.release.json -Value (@{ version = $env:RELEASE_VERSION } | ConvertTo-Json)
          cd frontend
          pnpm install --frozen-lockfile
          pnpm tauri build --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.json

      - name: Verify PE x64 Binary Architecture
        shell: pwsh
        run: |
          python -c @"
          import struct, sys
          with open(r'frontend\src-tauri\resources\ipc_bridge_app\ipc_bridge.exe', 'rb') as f:
              f.seek(0x3C)
              pe_offset = struct.unpack('<I', f.read(4))[0]
              f.seek(pe_offset + 4)
              machine = struct.unpack('<H', f.read(2))[0]
              assert machine == 0x8664, f'Expected PE x64 (0x8664), got {hex(machine)}'
              print('Verified sidecar PE x64 architecture (0x8664)')
          "@

      - name: Stage Windows x64 Release Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          $exe = Get-ChildItem -Path frontend/src-tauri/target -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -like "*nsis*" } | Select-Object -First 1
          if (-not $exe) { throw "NSIS Installer exe not found!" }
          Copy-Item $exe.FullName -Destination "dist-artifacts/MyPass_$env:RELEASE_VERSION`_x64-setup.exe"

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: dist-artifacts/MyPass_*_x64-setup.exe
          if-no-files-found: error

  build-windows-arm64:
    name: Build Windows (ARM64)
    needs: validate
    runs-on: windows-11-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version Variable
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like "v*") {
            $ver = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $ver = "${{ inputs.version_override }}"
            if (-not $ver) { $ver = "3.1.0-dev" }
          }
          echo "RELEASE_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows ARM64 Python Sidecar
        shell: pwsh
        run: |
          python -m venv backend/venv
          .\backend\venv\Scripts\python.exe -m pip install --upgrade pip
          .\backend\venv\Scripts\pip.exe install -r backend/requirements.txt
          python backend/build_sidecar.py

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc

      - name: Build Tauri Windows ARM64 NSIS Installer
        shell: pwsh
        run: |
          Set-Content -Path frontend/src-tauri/tauri.release.json -Value (@{ version = $env:RELEASE_VERSION } | ConvertTo-Json)
          cd frontend
          pnpm install --frozen-lockfile
          pnpm tauri build --target aarch64-pc-windows-msvc --config src-tauri/tauri.release.json

      - name: Verify PE ARM64 Binary Architecture
        shell: pwsh
        run: |
          python -c @"
          import struct, sys
          with open(r'frontend\src-tauri\resources\ipc_bridge_app\ipc_bridge.exe', 'rb') as f:
              f.seek(0x3C)
              pe_offset = struct.unpack('<I', f.read(4))[0]
              f.seek(pe_offset + 4)
              machine = struct.unpack('<H', f.read(2))[0]
              assert machine == 0xAA64, f'Expected PE ARM64 (0xAA64), got {hex(machine)}'
              print('Verified sidecar PE ARM64 architecture (0xAA64)')
          "@

      - name: Stage Windows ARM64 Release Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          $exe = Get-ChildItem -Path frontend/src-tauri/target -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -like "*nsis*" } | Select-Object -First 1
          if (-not $exe) { throw "NSIS Installer exe not found!" }
          Copy-Item $exe.FullName -Destination "dist-artifacts/MyPass_$env:RELEASE_VERSION`_arm64-setup.exe"

      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-exe
          path: dist-artifacts/MyPass_*_arm64-setup.exe
          if-no-files-found: error

  release:
    name: Package & Publish Release
    needs: [build-macos-arm64, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-dmg
          path: release-assets

      - name: Download Windows x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-exe
          path: release-assets

      - name: Download Windows ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-exe
          path: release-assets

      - name: Verify All 3 Installers & Generate Checksums
        run: |
          cd release-assets
          ls -la
          
          # Count installers
          COUNT=$(find . -maxdepth 1 \( -name "*.dmg" -o -name "*.exe" \) | wc -l)
          if [ "$COUNT" -ne 3 ]; then
            echo "Error: Expected 3 installer artifacts, found $COUNT"
            exit 1
          fi
          
          echo "Generating SHA-256 Checksums..."
          sha256sum MyPass* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Combined Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mypass-release-bundle
          path: release-assets/*

      - name: Publish GitHub Release (Tag Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
