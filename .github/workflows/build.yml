name: Build MyPass

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "MyPass" --icon assets/icon.ico --add-data "assets;assets" --hidden-import=PIL --hidden-import=customtkinter --hidden-import=cryptography main.py

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: MyPass-Windows
          path: dist/*
