name: MyPass CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security_audit:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Setup Xvfb for PySide6 tests
        run: sudo apt-get install libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils xvfb
      - name: Run Security Tests
        run: xvfb-run pytest tests/security/ -v
        
  build:
    name: Build & Bundle
    runs-on: macos-latest
    needs: security_audit
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Generate Build
        run: pyinstaller mypass.spec
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyPass-macOS
          path: dist/MyPass.app
